<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c7873"/>
      <stop offset="100%" stop-color="#1d4a54"/>
    </linearGradient>
  </defs>

  <!-- Background tile — solid fill for reliable favicon rendering, gradient as visual enhancement -->
  <rect width="64" height="64" rx="14" fill="#2c7873"/>
  <rect width="64" height="64" rx="14" fill="url(#fv-bg)"/>

  <!-- Notebook body, fold, and binding rings -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 13h22.5L48 20.5V47a5 5 0 0 1-5 5H18a5 5 0 0 1-5-5V18a5 5 0 0 1 5-5z" stroke="#f6fbf8" stroke-width="2.3"/>
    <path d="M40.5 13v7.5H48" stroke="#f6fbf8" stroke-width="2.3"/>
    <path d="M13 22h-4M13 30h-4M13 38h-4M13 46h-4" stroke="#d6e6df" stroke-width="2.2"/>
    <!-- Rule sits under the wordmark and matches its measured width (22 units). -->
    <path d="M19.5 40.5h22" stroke="#9fcfc8" stroke-width="1.7" opacity="0.8"/>
  </g>

  <!-- LM wordmark, centred on the notebook body axis (x13..x48 -> x=30.5). -->
  <text
    x="30.5"
    y="31"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#f6fbf8"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="16"
    letter-spacing="-0.5"
  >LM</text>
</svg>
