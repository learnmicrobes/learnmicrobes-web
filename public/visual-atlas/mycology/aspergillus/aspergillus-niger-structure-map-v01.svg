      <circle cx="28" cy="210" r="11" fill="url(#conidia-fill)"/>
      <circle cx="20" cy="142" r="10" fill="url(#conidia-fill)"/>
      <circle cx="76" cy="118" r="8" fill="url(#conidia-fill)"/>
      <circle cx="110" cy="82" r="8" fill="url(#conidia-fill)"/>
      <circle cx="150" cy="62" r="8" fill="url(#conidia-fill)"/>
