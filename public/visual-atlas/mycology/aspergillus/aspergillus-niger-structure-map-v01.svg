<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Aspergillus niger structure map</title>
  <desc id="desc">Educational structure map for Aspergillus niger showing vesicle, metulae and phialides, conidia, and conidiophore.</desc>
  <defs>
    <radialGradient id="panel-bg" cx="45%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f7f3ea"/>
    </radialGradient>
    <radialGradient id="vesicle-fill" cx="44%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#d8ecf8"/>
      <stop offset="58%" stop-color="#77afd1"/>
      <stop offset="100%" stop-color="#174d73"/>
    </radialGradient>
    <radialGradient id="conidia-fill" cx="34%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#a8d5ef"/>
      <stop offset="60%" stop-color="#2f82bc"/>
      <stop offset="100%" stop-color="#0a3f6c"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10212b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="26" fill="url(#panel-bg)"/>
  <rect x="1" y="1" width="918" height="418" rx="25" fill="none" stroke="#d4ded9" stroke-width="2"/>

  <text x="34" y="54" fill="#143f46" font-family="Arial, sans-serif" font-size="22" font-weight="900">STRUCTURE MAP</text>

  <g transform="translate(112 76)" filter="url(#soft-shadow)">
    <path d="M 248 306 C 226 260, 210 226, 190 188" fill="none" stroke="#8fc1dd" stroke-width="30" stroke-linecap="round"/>
    <path d="M 248 306 C 226 260, 210 226, 190 188" fill="none" stroke="#0d5482" stroke-width="5" stroke-linecap="round" opacity="0.48"/>

    <circle cx="168" cy="164" r="55" fill="url(#vesicle-fill)" stroke="#10212b" stroke-width="4"/>
    <circle cx="168" cy="164" r="42" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.42"/>

    <g stroke="#0b5d94" stroke-width="4" stroke-linecap="round" opacity="0.76">
      <path d="M168 164 L58 86"/>
      <path d="M168 164 L90 52"/>
      <path d="M168 164 L136 26"/>
      <path d="M168 164 L178 20"/>
