name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes close together used to take the site down: the newer run cancelled
# the older one mid-deploy, and Pages was left serving a half-published artifact
# until the next run finished. Queue instead of cancelling. GitHub keeps only one
# run pending per group, so a burst of pushes still deploys just the newest -- it
# simply never starts on top of a deploy that is already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # public/sitemap.xml is committed, not generated at build time, so that it
      # stays reviewable. Nothing otherwise notices when a photo batch lands and
      # the sitemap is not regenerated, so check it here rather than rewrite it.
      - name: Check the image sitemap is current
        run: npm run sitemap:images:check

      - name: Build React App
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

      # GitHub Pages answers unknown paths with 404.html and an HTTP 404, which keeps
      # every route but "/" out of search. This writes a real HTML file per route.
      - name: Pre-render pages for search engines
        run: npm run prerender

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
